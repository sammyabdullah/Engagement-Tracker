[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engagement-tracker"
version = "0.1.0"
description = "Score a contact list by reply engagement across multiple Gmail mailboxes."
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "tqdm>=4.66.0",
]

[project.scripts]
engagement-tracker = "engagement_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["engagement_tracker*"]
